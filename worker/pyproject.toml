[project]
name = "worker"
version = "0.1.0"
description = "Xanthil local analysis worker (restricted execution side)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
